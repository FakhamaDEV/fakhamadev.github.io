:root{
  color-scheme: light dark;

  --bg:#F7F2E7;
  --surface:#FCF9F1;
  --text:#23281F;
  --muted:#5F6455;
  --accent:#9A7B2E;
  --accent-ink:#6E561C;
  --border:#DCD4BF;
  --border-strong:#C6B998;

  --glow-warm:rgba(198,163,87,.42);
  --glow-olive:rgba(126,140,99,.28);
  --glow-soft:rgba(255,252,243,.85);

  --shadow-1:0 1px 2px rgba(35,40,31,.05);
  --shadow-2:0 12px 28px -20px rgba(35,40,31,.45);

  --r-sm:4px;
  --r-md:10px;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --s6:32px; --s7:48px; --s8:64px; --s9:88px;

  --font-sans:"IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-serif:"Amiri", "Noto Naskh Arabic", "Traditional Arabic", "Times New Roman", serif;

  --fs-xs:.8125rem;
  --fs-sm:.9375rem;
  --fs-md:1.0625rem;
  --fs-lg:clamp(1.25rem, 3.4vw, 1.5rem);
  --fs-xl:clamp(1.75rem, 5vw, 2.125rem);

  --ease:cubic-bezier(.22,.61,.36,1);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#15170F;
    --surface:#1C1F15;
    --text:#EDE7D6;
    --muted:#A8AC99;
    --accent:#C9A75C;
    --accent-ink:#D9BC7C;
    --border:#30342A;
    --border-strong:#474C3C;
    --glow-warm:rgba(201,167,92,.26);
    --glow-olive:rgba(128,148,102,.22);
    --glow-soft:rgba(38,43,32,.75);
    --shadow-1:0 1px 2px rgba(0,0,0,.35);
    --shadow-2:0 14px 30px -20px rgba(0,0,0,.8);
  }
}

*,*::before,*::after{box-sizing:border-box}

html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  background-color:var(--bg);
  background-image:
    radial-gradient(46% 34% at 88% -6%, var(--glow-warm) 0%, transparent 72%),
    radial-gradient(38% 26% at 6% 8%, var(--glow-olive) 0%, transparent 74%),
    radial-gradient(64% 38% at 50% 104%, var(--glow-soft) 0%, transparent 72%);
  background-repeat:no-repeat;
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font-sans);
  font-size:var(--fs-md);
  font-weight:400;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

a{color:inherit;text-decoration:none}

:focus-visible{
  outline:2px solid var(--accent-ink);
  outline-offset:3px;
  border-radius:var(--r-sm);
}

.site-header{
  display:flex;
  justify-content:center;
  padding-block-start:var(--s5);
  padding-inline:var(--s4);
}

.brand{
  display:inline-flex;
  align-items:center;
  gap:var(--s2);
  margin:0;
  font-family:var(--font-sans);
  font-size:var(--fs-xs);
  font-weight:500;
  letter-spacing:.22em;
  color:var(--accent-ink);
  direction:ltr;
  unicode-bidi:isolate;
}

.brand__mark{
  flex:none;
  width:1.3em;
  height:1.3em;
  color:var(--accent);
  overflow:visible;
}

main{
  flex:1;
  width:100%;
  max-width:680px;
  margin-inline:auto;
  padding-inline:clamp(20px, 6vw, 32px);
  padding-block:0 var(--s8);
}

.hero{
  position:relative;
  isolation:isolate;
  text-align:center;
  padding-block:var(--s8) var(--s7);
}

.eyebrow{
  margin:0;
  font-size:var(--fs-xs);
  font-weight:500;
  letter-spacing:0;
  color:var(--accent-ink);
}

.hero h1{
  margin:var(--s3) 0 0;
  font-family:var(--font-serif);
  font-size:var(--fs-xl);
  font-weight:700;
  line-height:1.3;
  letter-spacing:0;
  color:var(--text);
  text-wrap:balance;
}

.hero__note{
  margin:var(--s3) 0 0;
  color:var(--muted);
  font-size:var(--fs-sm);
  font-weight:300;
  letter-spacing:.02em;
}

.channels{
  list-style:none;
  margin:var(--s6) 0 0;
  padding:0;
  display:flex;
  justify-content:center;
  gap:var(--s3);
}

.channel{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:56px;
  height:56px;
  color:var(--text);
  background:var(--surface);
  border:1px solid var(--border-strong);
  border-radius:var(--r-sm);
  box-shadow:var(--shadow-1);
  transition:transform .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease), background-color .18s var(--ease);
}

.channel svg{
  width:22px;
  height:22px;
  fill:currentColor;
  transition:transform .18s var(--ease);
}

.channel:hover{
  color:var(--accent-ink);
  border-color:var(--accent);

  transform:translateY(-2px);
}

<script>
(function () {
  "use strict";

  var counter = new Intl.NumberFormat("ar-EG");
  document.querySelectorAll("[data-count]").forEach(function (el) {
    var value = Number(el.getAttribute("data-count"));
    if (!Number.isNaN(value)) {
      el.textContent = counter.format(value);
    }
  });

  var button = document.getElementById("copy-link");
  var status = document.getElementById("copy-status");
  var statusTimer = null;

  function showStatus(message) {
    if (!status) return;
    status.textContent = message;
    status.classList.add("is-visible");
    window.clearTimeout(statusTimer);
    statusTimer = window.setTimeout(function () {
      status.classList.remove("is-visible");
    }, 2400);
  }

  function legacyCopy(text) {
    var area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.top = "-1000px";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    var ok = false;
    try {
      ok = document.execCommand("copy");
    } catch (error) {
      ok = false;
    }
    document.body.removeChild(area);
    return ok;
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(
        function () { return true; },
        function () { return legacyCopy(text); }
      );
    }
    return Promise.resolve(legacyCopy(text));
  }

  if (button) {
    button.addEventListener("click", function () {
      copyText(window.location.href).then(function (ok) {
        showStatus(ok ? "تم نسخ الرابط" : "تعذّر نسخ الرابط");
        if (!ok) return;
        button.setAttribute("data-state", "done");
        window.setTimeout(function () {
          button.removeAttribute("data-state");
        }, 2400);
      });
    });
  }
})();
</script>
